        .container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }
        
        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
            background-color: rgba(26, 26, 26, 0.9);
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            font-family: 'Georgia', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f5d393;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }
        
        h2 {
            font-size: 1.2rem;
            color: #ccc;
            font-style: italic;
        }
        
        /* eBook viewer styles */
        .comic-viewer {
            flex: 1;
            display: flex;
            position: relative;
            width: 100%;
            overflow: hidden;
            perspective: 1200px;
        }
        
        .comic-container {
            display: flex;
            height: 100%;
            width: 100%;
            transform-style: preserve-3d;
        }
        
        .frame {
            min-width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
            transform: translateX(100%) rotateY(10deg);
            pointer-events: none;
        }
        
        .frame.active {
            opacity: 1;
            transform: translateX(0) rotateY(0);
            pointer-events: auto;
            z-index: 2;
        }
        
        .frame.prev {
            opacity: 0;
            transform: translateX(-100%) rotateY(-10deg);
            z-index: 1;
        }
        
        .frame-content {
            max-width: 90%;
            max-height: 90vh;
            position: relative;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            border: 5px solid #654321;
            background-color: white;
            transition: transform 0.5s ease;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #654321 #f5d393;
        }
        
        .frame-content::-webkit-scrollbar {
            width: 8px;
        }
        
        .frame-content::-webkit-scrollbar-track {
            background: rgba(245, 211, 147, 0.3);
        }
        
        .frame-content::-webkit-scrollbar-thumb {
            background-color: #654321;
            border-radius: 0;
        }
        
        .frame:hover .frame-content {
            transform: scale(1.02);
        }
        
        .frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .frame-info {
            background-color: #654321;
            padding: 10px 15px;
            font-size: 1rem;
            width: 100%;
            color: #f5d393;
            font-family: 'Georgia', serif;
            text-align: center;
            border-bottom: 2px solid #4a3015;
        }
        
        /* Navigation controls */
        .page-turn {
            position: absolute;
            top: 0;
            height: 100%;
            width: 15%;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
            transition: background 0.3s;
        }
        
        .page-turn.prev {
            left: 0;
        }
        
        .page-turn.next {
            right: 0;
        }
        
        .page-turn:hover {
            background-color: rgba(245, 211, 147, 0.05);
        }
        
        .page-turn::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 30px;
            border-top: 4px solid rgba(245, 211, 147, 0.5);
            border-right: 4px solid rgba(245, 211, 147, 0.5);
            transition: border-color 0.3s;
        }
        
        .page-turn.prev::after {
            left: 20px;
            transform: translateY(-50%) rotate(-135deg);
        }
        
        .page-turn.next::after {
            right: 20px;
            transform: translateY(-50%) rotate(45deg);
        }
        
        .page-turn:hover::after {
            border-color: rgba(245, 211, 147, 0.9);
        }
        
        .navigation-controls {
            position: relative;
            bottom: 20px;
            left: 50%;
            width: 20vw;
            min-width: 200px;

            justify-content: center;
            transform: translateX(-50%);
            background-color: rgba(101, 67, 33, 0.8);
            padding: 10px 15px;
            border-radius: 30px;
            z-index: 100;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .navigation-controls button {
            background-color: #4a3015;
            color: #f5d393;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
        }
        
        .navigation-controls button:hover {
            background-color: #f5d393;
            color: #4a3015;
            transform: translateY(-2px);
        }
        
        /* Episode selector */
        .episode-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .episode-selector select {
            background-color: #654321;
            color: #f5d393;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        /* Progress indicator */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 5px;
            background-color: #333;
            width: 100%;
            z-index: 100;
        }
        
        .progress-indicator {
            height: 100%;
            background: linear-gradient(to right, #654321, #f5d393);
            transition: width 0.3s;
        }
        
        /* Page turn effects */
        @keyframes pageInFromRight {
            from { 
                opacity: 0;
                transform: translateX(100%) rotateY(30deg);
            }
            to { 
                opacity: 1;
                transform: translateX(0) rotateY(0);
            }
        }
        
        @keyframes pageOutToLeft {
            from { 
                opacity: 1;
                transform: translateX(0) rotateY(0);
            }
            to { 
                opacity: 0;
                transform: translateX(-100%) rotateY(-30deg);
            }
        }
        
        @keyframes pageInFromLeft {
            from { 
                opacity: 0;
                transform: translateX(-100%) rotateY(-30deg);
            }
            to { 
                opacity: 1;
                transform: translateX(0) rotateY(0);
            }
        }
        
        @keyframes pageOutToRight {
            from { 
                opacity: 1;
                transform: translateX(0) rotateY(0);
            }
            to { 
                opacity: 0;
                transform: translateX(100%) rotateY(30deg);
            }
        }
        
        .page-in-from-right {
            animation: pageInFromRight 0.8s ease forwards;
        }
        
        .page-out-to-left {
            animation: pageOutToLeft 0.8s ease forwards;
        }
        
        .page-in-from-left {
            animation: pageInFromLeft 0.8s ease forwards;
        }
        
        .page-out-to-right {
            animation: pageOutToRight 0.8s ease forwards;
        }
        
        /* Transcript Styles */
        .transcript-section {
            background-color: rgba(245, 211, 147, 0.15);
            padding: 20px;
            border-top: 1px solid #654321;
            border-bottom: 1px solid #654321;
            font-family: 'Georgia', serif;
            color: #333;
        }
        
        .transcript-section h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #654321;
            text-align: center;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }
        
        .transcript-text {
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: justify;
            color: #333;
            max-height: 150px;
            overflow-y: auto;
            padding: 0 10px;
            scrollbar-width: thin;
            scrollbar-color: #654321 #f5d393;
        }
        
        .transcript-text::-webkit-scrollbar {
            width: 8px;
        }
        
        .transcript-text::-webkit-scrollbar-track {
            background: rgba(245, 211, 147, 0.3);
            border-radius: 4px;
        }
        
        .transcript-text::-webkit-scrollbar-thumb {
            background-color: #654321;
            border-radius: 4px;
        }
        
        /* Additional frame content styling for better integration */
        .frame img {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            display: block;
            border-bottom: 1px solid #e5c38350;
        }
        
        /* Transcript toggle button */
        .transcript-toggle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #654321;
            color: #f5d393;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 0.8rem;
            opacity: 0.7;
            transition: all 0.3s;
            z-index: 5;
        }
        
        .transcript-toggle:hover {
            opacity: 1;
            transform: translateY(-2px);
        }
        
        .transcript-hidden .transcript-section {
            display: none;
        }
        
        /* Accessibility */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Mahabharata</h1>
            <h2 id="episode-title">Episode 1</h2>
        </header>
        
        <div class="comic-viewer">
            <div class="comic-container" id="comic-container">
                <!-- Frames will be loaded dynamically -->
            </div>
            
            <button class="page-turn prev" id="prev-page" aria-label="Previous page"></button>
            <button class="page-turn next" id="next-page" aria-label="Next page"></button>
        </div>
        
        <div class="episode-selector">
            <label for="episode-select" class="visually-hidden">Select Episode</label>
            <select id="episode-select" aria-label="Select Episode">
                <option value="1">Episode 1</option>
                <option value="2">Episode 2</option>
                <option value="3">Episode 3</option>
                <!-- More episodes can be added here -->
            </select>
        </div>
        
        <div class="navigation-controls">
            <button id="btn-first">First</button>
            <button id="btn-prev">Previous</button>
            <button id="btn-next">Next</button>
            <button id="btn-last">Last</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-indicator" id="progress-indicator"></div>
        </div>
    </div>

    <script>
        // Frame data structure - in a real implementation, this would be loaded from a JSON file
        const episodes = {
            1: {
                title: "Episode 1",
                frames: [
                    { 
                        id: "frame-1", 
                        src: "storyboard/ep-1_sb-1.png",
                        transcript: "In the beginning, there was chaos. From this emerged Brahma, the creator, who set forth to bring order to the universe. In the lands that would become known as Bharata, great kingdoms rose and fell over countless generations."
                    },
                    { 
                        id: "frame-2", 
                        src: "storyboard/ep-1_sb-2.png",
                        transcript: "Among these kingdoms was Hastinapur, ruled by the descendants of King Bharata. In time, the throne passed to King Shantanu, who fell deeply in love with a beautiful woman named Ganga."
                    },
                    { 
                        id: "frame-3", 
                        src: "storyboard/ep-1_sb-3.png",
                        transcript: "Ganga agreed to marry Shantanu on one condition - that he would never question her actions, no matter how strange they might seem. Blinded by love, Shantanu agreed to this unusual request."
                    },
                    { 
                        id: "frame-4", 
                        src: "storyboard/ep-1_sb-4.png",
                        transcript: "In time, Ganga gave birth to a son. But to Shantanu's horror, she took the newborn to the river and drowned him. When this happened with seven children in succession, Shantanu could no longer remain silent."
                    },
                    { 
                        id: "frame-5", 
                        src: "storyboard/ep-1_sb-5.png",
                        transcript: "When Shantanu finally questioned her actions, Ganga revealed her true identity as the goddess of the sacred river. The children were incarnations of divine beings under a curse that required them to be returned to the heavens."
                    },
                    { 
                        id: "frame-6", 
                        src: "storyboard/ep-1_sb-6.png",
                        transcript: "Before departing, Ganga spared their eighth son, Devavrata, who would grow to become a great warrior and scholar, trained by the greatest sages and teachers of the realm."
                    },
                    { 
                        id: "frame-7", 
                        src: "storyboard/ep-1_sb-7.png",
                        transcript: "Years later, King Shantanu fell in love with Satyavati, the daughter of a fisherman. Her father would only allow the marriage if Shantanu promised that Satyavati's son would inherit the throne, not Devavrata."
                    },
                    { 
                        id: "frame-8", 
                        src: "storyboard/ep-1_sb-8.png",
                        transcript: "Learning of his father's dilemma, Devavrata made a terrible sacrifice. He vowed never to claim the throne and to remain celibate for life, ensuring that no descendants of his would ever challenge Satyavati's children."
                    },
                    { 
                        id: "frame-9", 
                        src: "storyboard/ep-1_sb-9.png",
                        transcript: "This great vow earned him the name Bhishma - 'he of the terrible oath.' The gods showered flowers from heaven, blessing him with the power to choose the time of his own death."
                    },
                    { 
                        id: "frame-10", 
                        src: "storyboard/ep-1_sb-10.png",
                        transcript: "Satyavati bore King Shantanu two sons, Chitrangada and Vichitravirya. After Shantanu's death, Chitrangada became king but was killed in battle, leaving his younger brother Vichitravirya to ascend the throne."
                    },
                    { 
                        id: "frame-11", 
                        src: "storyboard/ep-1_sb-11.png",
                        transcript: "When Vichitravirya came of age, Bhishma attended the swayamvara of the princesses of Kashi on his behalf. He defeated all the kings and princes present and brought the three princesses - Amba, Ambika, and Ambalika - to Hastinapur."
                    },
                    { 
                        id: "frame-12", 
                        src: "storyboard/ep-1_sb-12.png",
                        transcript: "Amba revealed she had already given her heart to King Salva. Bhishma allowed her to return to him, but Salva rejected her, saying he would not accept a woman who had been won by another man."
                    },
                    { 
                        id: "frame-12b", 
                        src: "storyboard/ep-1_sb-12b.png",
                        transcript: "Heartbroken and enraged, Amba blamed Bhishma for her fate. She vowed to be the cause of his death and immolated herself, later to be reborn as Shikhandi, who would play a crucial role in Bhishma's fall."
                    },
                    { 
                        id: "frame-13", 
                        src: "storyboard/ep-1_sb-13.png",
                        transcript: "Meanwhile, King Vichitravirya married Ambika and Ambalika but died young without producing an heir. To continue the royal line, Satyavati called upon her firstborn son, Vyasa, born before her marriage to Shantanu."
                    },
                    { 
                        id: "frame-14", 
                        src: "storyboard/ep-1_sb-14.png",
                        transcript: "Vyasa, a great sage with fearsome appearance, was asked to father children with the widowed queens through the custom of Niyoga. Ambika closed her eyes when she saw him, resulting in a blind son named Dhritarashtra."
                    },
                    { 
                        id: "frame-15", 
                        src: "storyboard/ep-1_sb-15.png",
                        transcript: "Ambalika turned pale at the sight of Vyasa, resulting in a pale son named Pandu. Satyavati then sent Ambika's maid to Vyasa, who gave birth to a wise and healthy son named Vidura."
                    },
                    { 
                        id: "frame-16", 
                        src: "storyboard/ep-1_sb-16.png",
                        transcript: "Thus began the foundation of a complex bloodline that would shape the destiny of Hastinapur. The blind Dhritarashtra, the pale Pandu, and the wise Vidura - three brothers whose descendants would become central to the great epic of the Mahabharata."
                    }
                ]
            },
            // Add more episodes as needed
            2: {
                title: "Episode 2",
                frames: [
                    { 
                        id: "frame-1", 
                        src: "storyboard/ep-2_sb-1.png",
                        transcript: "The story continues with the next generation of the Kuru dynasty..."
                    }
                    // Add frames for episode 2
                ]
            }
        };
        
        // State variables
        let currentEpisode = 1;
        let currentFrameIndex = 0;
        let isAnimating = false; // Flag to prevent navigation during animations
        
        // DOM Elements
        const comicContainer = document.getElementById('comic-container');
        const episodeTitle = document.getElementById('episode-title');
        const progressIndicator = document.getElementById('progress-indicator');
        const episodeSelect = document.getElementById('episode-select');
        
        // Initialize the comic viewer
        function initComicViewer() {
            loadEpisode(currentEpisode);
            
            // Set up event listeners
            document.getElementById('prev-page').addEventListener('click', prevFrame);
            document.getElementById('next-page').addEventListener('click', nextFrame);
            document.getElementById('btn-first').addEventListener('click', goToFirstFrame);
            document.getElementById('btn-prev').addEventListener('click', prevFrame);
            document.getElementById('btn-next').addEventListener('click', nextFrame);
            document.getElementById('btn-last').addEventListener('click', goToLastFrame);
            episodeSelect.addEventListener('change', changeEpisode);
            
            // Set up transcript toggle listeners
            setupTranscriptToggles();
            
            // Keyboard navigation
            document.addEventListener('keydown', handleKeyNavigation);
            
            // Touch events for mobile swiping
            setupSwipeNavigation();
            
            // Update progress indicator
            updateProgressIndicator();
        }
        
        // Load frames for a specific episode
        function loadEpisode(episodeNum) {
            // Clear current frames
            comicContainer.innerHTML = '';
            
            // Get episode data
            const episode = episodes[episodeNum];
            if (!episode) return;
            
            // Update episode title
            episodeTitle.textContent = episode.title;
            
            // Create frame elements
            episode.frames.forEach((frame, index) => {
                const frameElement = document.createElement('div');
                frameElement.className = 'frame';
                frameElement.id = frame.id;
                
                frameElement.innerHTML = `
                    <div class="frame-content">
                        <div class="frame-info">Frame ${index + 1}</div>
                        <img src="${frame.src}" alt="Frame ${index + 1}" loading="lazy">
                        <div class="transcript-section">
                            <h3>Transcript</h3>
                            <div class="transcript-text">
                                ${frame.transcript || "No transcript available."}
                            </div>
                        </div>
                        <div class="comment-section" id="comment-section-${frame.id}">
                            <h3>Comments</h3>
                            <div class="comments-container" id="comments-${frame.id}">
                                <p class="loading-text">Loading comments...</p>
                            </div>
                            <form id="comment-form-${frame.id}" class="comment-form">
                                <textarea placeholder="Add your comment..."></textarea>
                                <button type="submit">Post</button>
                            </form>
                        </div>
                        <button class="transcript-toggle">Toggle Transcript</button>
                    </div>
                `;
                
                comicContainer.appendChild(frameElement);
            });
            
            // Reset to first frame
            currentFrameIndex = 0;
            updateFramePosition(false);
            
            // Preload adjacent images for smoother transitions
            preloadAdjacentImages();
        }
        
        // Preload images for smoother transitions
        function preloadAdjacentImages() {
            const frames = episodes[currentEpisode].frames;
            const preloadIndexes = [
                currentFrameIndex + 1, 
                currentFrameIndex + 2, 
                currentFrameIndex - 1
            ];
            
            preloadIndexes.forEach(index => {
                if (index >= 0 && index < frames.length) {
                    const img = new Image();
                    img.src = frames[index].src;
                }
            });
        }
        
        // Update frame position
        function updateFramePosition(animate = true) {
            const frames = document.querySelectorAll('.frame');
            
            // Reset all frames
            frames.forEach((frame, index) => {
                frame.className = 'frame';
                
                if (index < currentFrameIndex) {
                    frame.classList.add('prev');
                } else if (index > currentFrameIndex) {
                    // Leave these with default styling (to the right)
                }
            });
            
            // Set active frame
            if (frames[currentFrameIndex]) {
                frames[currentFrameIndex].className = 'frame active';
                
                // Dispatch event for comment system integration
                const frameId = frames[currentFrameIndex].id;
                document.dispatchEvent(new CustomEvent('frameChanged', {
                    detail: { frameId }
                }));
            }
            
            // Preload next images
            preloadAdjacentImages();
            
            // Update progress indicator
            updateProgressIndicator();
        }
        
        // Navigation functions with animations
        function nextFrame() {
            if (isAnimating) return;
            
            const totalFrames = episodes[currentEpisode].frames.length;
            
            if (currentFrameIndex < totalFrames - 1) {
                const currentFrame = document.querySelector('.frame.active');
                const nextFrame = document.querySelectorAll('.frame')[currentFrameIndex + 1];
                
                if (currentFrame && nextFrame) {
                    isAnimating = true;
                    
                    // Animate current frame out to left
                    currentFrame.classList.add('page-out-to-left');
                    
                    // Animate next frame in from right
                    nextFrame.classList.add('page-in-from-right');
                    
                    // Wait for animation to complete
                    setTimeout(() => {
                        currentFrameIndex++;
                        updateFramePosition();
                        isAnimating = false;
                    }, 800);
                }
            } else {
                // Try to move to next episode
                if (episodes[currentEpisode + 1]) {
                    currentEpisode++;
                    episodeSelect.value = currentEpisode;
                    loadEpisode(currentEpisode);
                }
            }
        }
        
        function prevFrame() {
            if (isAnimating) return;
            
            if (currentFrameIndex > 0) {
                const currentFrame = document.querySelector('.frame.active');
                const prevFrame = document.querySelectorAll('.frame')[currentFrameIndex - 1];
                
                if (currentFrame && prevFrame) {
                    isAnimating = true;
                    
                    // Animate current frame out to right
                    currentFrame.classList.add('page-out-to-right');
                    
                    // Animate previous frame in from left
                    prevFrame.classList.add('page-in-from-left');
                    
                    // Wait for animation to complete
                    setTimeout(() => {
                        currentFrameIndex--;
                        updateFramePosition();
                        isAnimating = false;
                    }, 800);
                }
            } else {
                // Try to move to previous episode's last frame
                if (episodes[currentEpisode - 1]) {
                    currentEpisode--;
                    episodeSelect.value = currentEpisode;
                    loadEpisode(currentEpisode);
                    currentFrameIndex = episodes[currentEpisode].frames.length - 1;
                    updateFramePosition();
                }
            }
        }
        
        function goToFirstFrame() {
            if (isAnimating) return;
            currentFrameIndex = 0;
            updateFramePosition();
        }
        
        function goToLastFrame() {
            if (isAnimating) return;
            currentFrameIndex = episodes[currentEpisode].frames.length - 1;
            updateFramePosition();
        }
        
        function changeEpisode() {
            if (isAnimating) return;
            currentEpisode = parseInt(episodeSelect.value);
            loadEpisode(currentEpisode);
        }
        
        // Update progress indicator
        function updateProgressIndicator() {
            const totalFrames = episodes[currentEpisode].frames.length;
            const progress = ((currentFrameIndex + 1) / totalFrames) * 100;
            progressIndicator.style.width = `${progress}%`;
        }
        
        // Handle keyboard navigation
        function handleKeyNavigation(e) {
            if (isAnimating) return;
            
            switch(e.code) {
                case 'ArrowRight':
                case 'Space':
                    e.preventDefault();
                    nextFrame();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    prevFrame();
                    break;
                case 'Home':
                    e.preventDefault();
                    goToFirstFrame();
                    break;
                case 'End':
                    e.preventDefault();
                    goToLastFrame();
                    break;
            }
        }
        
        // Setup swipe navigation for mobile devices
        function setupSwipeNavigation() {
            let touchStartX = 0;
            let touchEndX = 0;
            
            document.addEventListener('touchstart', e => {
                if (isAnimating) return;
                touchStartX = e.changedTouches[0].screenX;
            });
            
            document.addEventListener('touchend', e => {
                if (isAnimating) return;
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });
            
            function handleSwipe() {
                const swipeThreshold = 50; // minimum swipe distance
                if (touchEndX < touchStartX - swipeThreshold) {
                    // Swipe left -> next frame
                    nextFrame();
                } else if (touchEndX > touchStartX + swipeThreshold) {
                    // Swipe right -> previous frame
                    prevFrame();
                }
            }
        }
        
        // Setup transcript toggle functionality
        function setupTranscriptToggles() {
            // Delegate event to document to catch dynamically added buttons
            document.addEventListener('click', function(e) {
                if (e.target && e.target.classList.contains('transcript-toggle')) {
                    const frameContent = e.target.closest('.frame-content');
                    frameContent.classList.toggle('transcript-hidden');
                    
                    // Update button text
                    if (frameContent.classList.contains('transcript-hidden')) {
                        e.target.textContent = 'Show Transcript';
                    } else {
                        e.target.textContent = 'Hide Transcript';
                    }
                }
            });
        }
        
        // Initialize when DOM is fully loaded
        document.addEventListener('DOMContentLoaded', initComicViewer);
    </script>
    <script src="js/comments.js"></script>
</body>
